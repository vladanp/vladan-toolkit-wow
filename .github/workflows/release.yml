name: Release

# Every push to main that changes the addon tags the next patch version, then re-runs this
# workflow on that tag (tags pushed by GITHUB_TOKEN don't trigger runs; dispatches do).
# The tag run publishes a GitHub release (zip + release.json) that WowUp auto-updates from.
on:
  push:
    branches: [main]
    paths: ["**.lua", "**.toc", ".pkgmeta", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency: release-${{ github.ref }}

jobs:
  tag:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag next patch version and release it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(git tag --points-at HEAD | head -1)
          if [ -z "$tag" ]; then
            last=$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)
            IFS=. read -r major minor patch <<< "${last#v}"
            tag="v$major.$minor.$((patch + 1))"
            git tag "$tag"
            git push origin "$tag"
          fi
          gh workflow run release.yml --ref "$tag"

  package:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
